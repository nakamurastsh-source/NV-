<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ノースベッツ牛群データ記録</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#1E4D35;--green2:#2D6B4A;--green3:#3D8B60;--green-light:#EAF3EE;
  --amber:#C17D2A;--red:#B03A2E;
  --bg:#F5F4F0;--white:#FFFFFF;--text:#1A2E23;--text2:#4A6355;--border:#D4DDD8;
  --radius:12px;--radius-sm:8px;
  --cow-black:#1a1a1a;--cow-white:#f8f6f0;
}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(ellipse 38px 28px at 8% 12%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 22px 32px at 18% 6%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 44px 22px at 35% 18%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 18px 26px at 55% 8%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 30px 20px at 72% 15%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 26px 34px at 88% 5%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 20px 24px at 95% 22%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 36px 20px at 4% 38%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 28px 18px at 28% 45%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 40px 26px at 62% 35%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 24px 30px at 82% 42%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 32px 22px at 12% 62%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 20px 28px at 42% 68%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 34px 18px at 68% 58%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 22px 32px at 90% 65%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 28px 20px at 22% 82%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 38px 24px at 50% 88%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 18px 28px at 76% 78%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 26px 16px at 5% 92%, #1a1a1a 100%, transparent 100%),
    radial-gradient(ellipse 30px 22px at 95% 88%, #1a1a1a 100%, transparent 100%);
  background-color:#f8f6f0;
  opacity:0.07;
}
#app{max-width:480px;margin:0 auto;}
.app-header{background:var(--green);color:#fff;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;}
.app-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse 24px 16px at 75% 20%, rgba(255,255,255,0.12) 100%, transparent 100%),
    radial-gradient(ellipse 14px 20px at 82% 10%, rgba(255,255,255,0.10) 100%, transparent 100%),
    radial-gradient(ellipse 18px 12px at 90% 30%, rgba(255,255,255,0.08) 100%, transparent 100%),
    radial-gradient(ellipse 20px 14px at 68% 60%, rgba(255,255,255,0.09) 100%, transparent 100%),
    radial-gradient(ellipse 12px 18px at 95% 65%, rgba(255,255,255,0.07) 100%, transparent 100%),
    radial-gradient(ellipse 16px 10px at 60% 85%, rgba(255,255,255,0.08) 100%, transparent 100%);
  background-color:transparent;
}
.app-header h1{font-size:18px;font-weight:700;position:relative;}
.app-header .sub{font-size:11px;opacity:.7;letter-spacing:1.5px;}
.farm-selector{display:flex;align-items:center;gap:8px;}
.farm-selector select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:999px;font-size:13px;font-family:inherit;font-weight:700;}
.farm-selector select option{background:var(--green);color:#fff;}
.add-farm-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:16px;padding:24px 20px;width:calc(100% - 40px);max-width:360px;}
.modal h3{font-size:16px;margin-bottom:16px;color:var(--green);}
.modal input{width:100%;padding:12px;font-size:16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
.btn-cancel{background:var(--bg);color:var(--text2);}
.btn-ok{background:var(--green);color:#fff;}
.page-nav{background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.page-nav::-webkit-scrollbar{display:none;}
.page-nav button{padding:12px 14px;font-size:13px;font-weight:700;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;flex-shrink:0;}
.page-nav button.active{color:var(--green);border-bottom-color:var(--green);}
.card{background:var(--white);border-radius:var(--radius);padding:16px;margin:12px 12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid transparent;background-clip:padding-box;}
.card-title{font-size:15px;font-weight:700;color:var(--green);margin-bottom:14px;padding-bottom:10px;border-bottom:2px dashed var(--green-light);}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;background:#FAFAF8;color:var(--text);}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--green3);border-color:var(--green3);}
.field textarea{resize:vertical;min-height:80px;}
.unit{font-size:12px;color:var(--text2);margin-left:4px;}
.ph-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ph-btn{width:44px;height:44px;font-size:22px;font-weight:700;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;color:var(--green);font-family:inherit;display:flex;align-items:center;justify-content:center;}
.ph-strip-bar{flex:1;height:14px;border-radius:7px;position:relative;background:linear-gradient(90deg,rgb(198,64,50) 0%,rgb(228,160,50) 25%,rgb(212,196,60) 37%,rgb(110,168,80) 50%,rgb(60,140,150) 75%,rgb(70,90,160) 100%);}
.ph-strip-marker{position:absolute;top:-5px;width:18px;height:24px;border-radius:5px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .1s;}
.save-btn{width:100%;padding:15px;font-size:17px;font-weight:700;border:none;border-radius:var(--radius);background:var(--green);color:#fff;cursor:pointer;font-family:inherit;margin-top:4px;}
.save-msg{margin-top:10px;font-size:13px;font-weight:700;color:var(--green);text-align:center;}
.err-msg{color:var(--red);}
.date-bar{background:var(--green-light);border-radius:var(--radius-sm);padding:10px 14px;margin:12px 12px 0;display:flex;align-items:center;justify-content:space-between;}
.date-bar label{font-size:12px;font-weight:700;color:var(--green2);}
.date-bar input{border:none;background:transparent;font-size:15px;font-weight:700;color:var(--green);font-family:inherit;text-align:right;}
.records-section{margin:12px 12px 0;}
.records-section h3{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.record-item{background:var(--white);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:flex-start;}
.record-item .rec-content{font-size:14px;font-weight:700;flex:1;}
.record-item .rec-tag{font-size:11px;color:var(--green3);background:var(--green-light);padding:2px 7px;border-radius:999px;margin-bottom:4px;display:inline-block;}
.del-btn{border:none;background:transparent;color:#aaa;font-size:12px;cursor:pointer;padding:4px;font-family:inherit;flex-shrink:0;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--green);display:flex;z-index:10;border-top:3px solid rgba(255,255,255,0.15);}
.bottom-nav::before{content:'🐄';position:absolute;right:8px;top:-18px;font-size:20px;opacity:0.6;pointer-events:none;}
.bottom-nav button{flex:1;padding:10px 4px;font-size:10px;font-weight:700;border:none;background:transparent;color:rgba(255,255,255,.65);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.bottom-nav button.active{color:#fff;background:var(--green2);}
.bottom-nav .nav-icon{font-size:16px;}
.chart-card{background:var(--white);border-radius:var(--radius);padding:14px 12px;margin:12px 12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.chart-card h3{font-size:14px;font-weight:700;color:var(--green);margin-bottom:6px;}
.chart-note{font-size:11px;color:var(--text2);margin-top:6px;}
.chart-empty{text-align:center;padding:24px 10px;color:var(--text2);font-size:13px;}
.export-bar{margin:12px 12px 0;display:flex;gap:8px;}
.export-btn{flex:1;padding:12px;font-size:14px;font-weight:700;border:1.5px solid var(--green);border-radius:var(--radius-sm);background:#fff;color:var(--green);cursor:pointer;font-family:inherit;}
.score-chips{display:flex;gap:6px;flex-wrap:wrap;}
.score-chip{flex:1;min-width:60px;padding:10px 4px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;text-align:center;color:var(--text2);}
.score-chip.selected{background:var(--green);color:#fff;border-color:var(--green);}
.hidden{display:none;}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.photo-thumb-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
.photo-remove-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0;}
.field input[type="file"]{width:100%;padding:10px;font-size:13px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:#FAFAF8;font-family:inherit;}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div>
      <div class="sub">🐄 NORTH VETS</div>
      <h1>牛群データ記録</h1>
    </div>
    <div class="farm-selector">
      <select id="farmSelect"></select>
      <button class="add-farm-btn" id="addFarmBtn">＋</button>
    </div>
  </header>

  <div class="modal-overlay hidden" id="farmModal">
    <div class="modal">
      <h3>農場を追加</h3>
      <input type="text" id="newFarmInput" placeholder="農場名を入力">
      <div class="modal-btns">
        <button class="btn-cancel" id="farmModalCancel">キャンセル</button>
        <button class="btn-ok" id="farmModalOk">追加</button>
      </div>
    </div>
  </div>

  <div id="viewRecord">
    <div class="date-bar">
      <label>訪問日</label>
      <input type="date" id="visitDate">
    </div>
    <nav class="page-nav" id="pageNav"></nav>
    <div id="pageContent"></div>
  </div>

  <div id="viewList" class="hidden">
    <nav class="page-nav" id="listPageNav"></nav>
    <div class="export-bar">
      <button class="export-btn" id="csvExportBtn">📥 CSVエクスポート</button>
    </div>
    <div id="listContent"></div>
  </div>

  <div id="viewChart" class="hidden">
    <nav class="page-nav" id="chartPageNav"></nav>
    <div class="export-bar">
      <button class="export-btn" id="chartCsvExportBtn">📥 グラフデータCSV</button>
    </div>
    <div id="chartContent"></div>
  </div>

  <nav class="bottom-nav">
    <button class="active" data-view="record"><span class="nav-icon">✏️</span>記録</button>
    <button data-view="list"><span class="nav-icon">📋</span>一覧</button>
    <button data-view="chart"><span class="nav-icon">📈</span>グラフ</button>
  </nav>
</div>

<script>
const STORE_KEY = "dairy:v2";
const PH_MIN = 6.0;
const PH_MAX = 6.8;

// ページ定義
const PAGES = [
  { id:"production", label:"生産データ", custom:"production" },
  { id:"memo", label:"メモ", custom:"memo" },
  { id:"silage", label:"GS", custom:"silage" },
  { id:"silage_corn", label:"CS", custom:"silage_corn" },
  { id:"ph", label:"尿pH", custom:"ph" },
  { id:"feces", label:"糞便検査", custom:"feces" },
  { id:"pssb", label:"PSPS", custom:"pssb" },
];

let records = [], farms = ["農場1"], currentFarm = "農場1";
let currentPage = "production", currentView = "record", phVal = 7.0;
let memoPhotos = [];
const MEMO_PHOTO_LIMIT = 20;

function todayStr() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function phColor(p) {
  const stops=[[5,[198,64,50]],[6,[228,160,50]],[6.5,[212,196,60]],[7,[110,168,80]],[8,[60,140,150]],[9,[70,90,160]]];
  p=Math.max(5,Math.min(9,p));
  for(let i=0;i<stops.length-1;i++){const [a,ca]=stops[i],[b,cb]=stops[i+1];if(p>=a&&p<=b){const t=(p-a)/(b-a);const c=ca.map((v,j)=>Math.round(v+(cb[j]-v)*t));return "rgb("+c[0]+","+c[1]+","+c[2]+")";}}
  return "rgb(110,168,80)";
}
function yearOptions(selectedYear){
  const now=new Date();
  const sel=selectedYear?parseInt(selectedYear):now.getFullYear();
  return Array.from({length:6},(_,i)=>now.getFullYear()-2+i).map(y=>'<option value="'+y+'"'+(y===sel?' selected':'')+'>'+y+'年</option>').join("");
}
function persist(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({records,farms,currentFarm}));
    return true;
  }catch(e){
    alert("保存容量の上限に達した可能性があります。写真のサイズを減らすか、不要な記録を削除してから、もう一度お試しください。");
    return false;
  }
}
function load(){
  try{const v=localStorage.getItem(STORE_KEY);if(v){const d=JSON.parse(v);records=d.records||[];if(d.farms&&d.farms.length)farms=d.farms;if(d.currentFarm&&farms.includes(d.currentFarm))currentFarm=d.currentFarm;}}catch(e){}
}

// Farm selector
function renderFarmSelect(){
  document.getElementById("farmSelect").innerHTML=farms.map(f=>'<option value="'+f+'"'+(f===currentFarm?' selected':'')+'>'+f+'</option>').join("");
}
document.getElementById("farmSelect").onchange=e=>{currentFarm=e.target.value;persist();if(currentView==="list"){renderListNav();renderList();}if(currentView==="chart"){renderChartNav();renderChart();}};
document.getElementById("addFarmBtn").onclick=()=>{document.getElementById("newFarmInput").value="";document.getElementById("farmModal").classList.remove("hidden");};
document.getElementById("farmModalCancel").onclick=()=>document.getElementById("farmModal").classList.add("hidden");
document.getElementById("farmModalOk").onclick=()=>{
  const name=document.getElementById("newFarmInput").value.trim();
  if(!name)return;if(farms.includes(name)){alert("同じ名前の農場があります");return;}
  farms.push(name);currentFarm=name;persist();renderFarmSelect();document.getElementById("farmModal").classList.add("hidden");
};
document.getElementById("newFarmInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("farmModalOk").click();});

// Page nav
function renderPageNav(){
  const nav=document.getElementById("pageNav");
  nav.innerHTML=PAGES.map(p=>'<button data-page="'+p.id+'"'+(p.id===currentPage?' class="active"':'')+'>'+p.label+'</button>').join("");
  nav.querySelectorAll("button").forEach(btn=>{btn.onclick=()=>{currentPage=btn.dataset.page;renderPageNav();renderPageContent();};});
  const active=nav.querySelector(".active");if(active)active.scrollIntoView({inline:"center",behavior:"smooth"});
}

// スコアチップUI
function scoreChips(id, labels) {
  return '<div class="score-chips" id="chips_'+id+'">'+labels.map((l,i)=>'<button type="button" class="score-chip" data-val="'+(i+1)+'" onclick="selectChip(\''+id+'\','+(i+1)+')">'+l+'</button>').join("")+'</div>'
    +'<input type="hidden" id="'+id+'" value="">';
}
window.selectChip = function(id, val) {
  document.getElementById(id).value = val;
  document.querySelectorAll('#chips_'+id+' .score-chip').forEach(c=>{
    c.classList.toggle('selected', c.dataset.val == val);
  });
};

// Page content
function renderPageContent(){
  const page=PAGES.find(p=>p.id===currentPage);
  const el=document.getElementById("pageContent");

  // --- 尿pH ---
  if(page.custom==="ph"){
    el.innerHTML='<div class="card">'
      +'<div class="card-title">尿pH記録 <span style="font-size:12px;color:var(--text2);font-weight:500;">目標: '+PH_MIN.toFixed(1)+'–'+PH_MAX.toFixed(1)+'</span></div>'
      +'<div class="field"><label>牛の番号・名前</label>'
      +'<input type="text" id="ph_cow" placeholder="例: 102号" list="cowlist" autocomplete="off">'
      +'<datalist id="cowlist"></datalist></div>'
      +'<div class="field"><label>pH値</label>'
      +'<div class="ph-row">'
      +'<button class="ph-btn" id="phMinus">−</button>'
      +'<div style="text-align:center"><input type="number" id="phNumInput" step="0.01" inputmode="decimal" style="font-size:32px;font-weight:700;width:100px;text-align:center;border:1.5px solid var(--border);border-radius:8px;padding:4px 2px;background:#fff;font-family:inherit;">'
      +'<div id="phRangeLabel" style="font-size:11px;font-weight:700;margin-top:2px;"></div></div>'
      +'<button class="ph-btn" id="phPlus">＋</button>'
      +'<div style="flex:1"><div class="ph-strip-bar" style="position:relative;">'
      +'<div id="phTargetRange" style="position:absolute;top:-3px;bottom:-3px;border:2px solid var(--green);border-radius:4px;pointer-events:none;"></div>'
      +'<div class="ph-strip-marker" id="phMarker"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-top:5px;"><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>'
      +'</div></div></div>'
      +'<div class="field"><label>メモ</label><input type="text" id="ph_memo" placeholder="任意"></div>'
      +'<button class="save-btn" id="phSaveBtn">保存</button>'
      +'<div class="save-msg hidden" id="phSaveMsg"></div></div>';
    updatePhDisplay();updateCowlist();
    document.getElementById("phMinus").onclick=()=>{phVal=Math.max(4,Math.round((phVal-0.1)*100)/100);updatePhDisplay();};
    document.getElementById("phPlus").onclick=()=>{phVal=Math.min(10,Math.round((phVal+0.1)*100)/100);updatePhDisplay();};
    document.getElementById("phNumInput").oninput=function(){
      const v=parseFloat(this.value);
      if(!isNaN(v)){phVal=Math.max(4,Math.min(10,v));updatePhDisplay();}
    };
    document.getElementById("phNumInput").onblur=function(){updatePhDisplay();};
    document.getElementById("phSaveBtn").onclick=savePhRecord;
    return;
  }

  // --- 生産データ（乳成分・乳価・生産量 統合） ---
  if(page.custom==="production"){
    const now=new Date();
    const yearOpts=Array.from({length:6},(_,i)=>now.getFullYear()-2+i).map(y=>'<option value="'+y+'"'+(y===now.getFullYear()?' selected':'')+'>'+y+'年</option>').join("");
    const monthOpts=Array.from({length:12},(_,i)=>i+1).map(m=>'<option value="'+m+'"'+(m===now.getMonth()+1?' selected':'')+'>'+m+'月</option>').join("");
    el.innerHTML='<div class="card">'
      +'<div class="card-title">生産データ</div>'

      // --- 乳量 ---
      +'<div style="font-size:13px;font-weight:700;color:var(--green2);margin-bottom:10px;padding:6px 0;border-bottom:1px solid var(--green-light);">📦 出荷乳量</div>'
      +'<div class="field"><label>出荷乳量1 (L/日)</label><input type="number" id="prod_milk_l1" step="1" placeholder="例: 1500" oninput="calcProd()"></div>'
      +'<div class="field"><label>出荷乳量2 (L/日)</label><input type="number" id="prod_milk_l2" step="1" placeholder="例: 1500" oninput="calcProd()"></div>'
      +'<div class="field"><label>出荷乳量3 (L/日)</label><input type="number" id="prod_milk_l3" step="1" placeholder="例: 1078" oninput="calcProd()"></div>'
      +'<div style="background:#f5f7f5;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">'
      +'<span style="font-size:13px;font-weight:700;color:var(--green2);">出荷乳量合計 (L)</span>'

window.calcProd=function(){
  const l1=parseFloat(document.getElementById("prod_milk_l1")?.value)||0;
  const l2=parseFloat(document.getElementById("prod_milk_l2")?.value)||0;
  const l3=parseFloat(document.getElementById("prod_milk_l3")?.value)||0;
  const l=l1+l2+l3;
  const totalLEl=document.getElementById("prod_milk_l_total");
  if(totalLEl) totalLEl.textContent=l>0?l+" L":"—";
  const shipped=parseFloat(document.getElementById("prod_shipped")?.value)||0;
  const fat=parseFloat(document.getElementById("mc_fat")?.value)||0;
  const prot=parseFloat(document.getElementById("mc_protein")?.value)||0;
  const snf=parseFloat(document.getElementById("mc_snf")?.value)||0;
  const fatPrice=parseFloat(document.getElementById("mp_fat")?.value)||0;
  const snfPrice=parseFloat(document.getElementById("mp_snf")?.value)||0;
  const subsidy=parseFloat(document.getElementById("mp_subsidy")?.value)||0;
  const quality=parseFloat(document.getElementById("mp_quality")?.value)||0;
  const feed=parseFloat(document.getElementById("prod_feed")?.value)||0;

  const kgEl=document.getElementById("prod_milk_kg_disp");
  const avgEl=document.getElementById("prod_avg_disp");
  const fatYieldEl=document.getElementById("prod_fat_yield_disp");
  const fatProtEl=document.getElementById("prod_fat_prot_disp");
  const fpEl=document.getElementById("pf_ratio_display");
  const priceEl=document.getElementById("prod_price_disp");
  const noteEl=document.getElementById("prod_price_note");
  if(!kgEl)return;

  const kg=l>0?Math.round(l*1.03*10)/10:0;
  kgEl.textContent=kg>0?kg.toFixed(1)+" kg":"—";
  const avg=(kg>0&&shipped>0)?(kg/shipped):0;
  avgEl.textContent=avg>0?avg.toFixed(1)+" kg/頭":"—";

  // 平均乳脂肪生産量 = 平均出荷乳量 × (乳脂肪率/100)
  const fatYield=(avg>0&&fat>0)?avg*(fat/100):0;
  if(fatYieldEl) fatYieldEl.textContent=fatYield>0?fatYield.toFixed(2)+" kg/頭":"—";

  // Fat+Prot = (((平均出荷乳量×(乳脂肪率/100))+(平均出荷乳量×((乳蛋白率-0.19)/100))))×2.2
  const fatProt=(avg>0&&fat>0&&prot>0)?(((avg*(fat/100))+(avg*((prot-0.19)/100)))*2.2):0;
  if(fatProtEl) fatProtEl.textContent=fatProt>0?fatProt.toFixed(2)+" lb":"—";

  const milking=parseFloat(document.getElementById("prod_milking")?.value)||0;

  // 一頭当たり給餌量
  const woEl=document.getElementById("prod_wo_disp");
  if(woEl) woEl.textContent=(feed>0&&milking>0)?(feed/milking).toFixed(1)+" kg/頭":"—";

  // F/P比
  if(fat>0&&prot>0){
    const fp=(fat/prot).toFixed(3);
    fpEl.textContent=fp;
    fpEl.style.color=parseFloat(fp)>=1.0&&parseFloat(fp)<=1.5?"var(--green3)":"var(--red)";
  } else {fpEl.textContent="—";fpEl.style.color="var(--text2)";}

  // 実質乳価
  if(kg>0&&fat>0&&snf>0&&fatPrice>0&&snfPrice>0){
    const total=(kg*fat/100*fatPrice)+(kg*snf/100*snfPrice);
    const unitPrice=total/kg+subsidy+quality;
    priceEl.textContent=unitPrice.toFixed(2)+" 円/kg";
    noteEl.textContent="";
  } else {
    priceEl.textContent="—";
    noteEl.textContent="乳量・乳成分・単価を入力してください";
  }
};

function saveProdRecord(){
  const l1=document.getElementById("prod_milk_l1").value;
  const l2=document.getElementById("prod_milk_l2").value;
  const l3=document.getElementById("prod_milk_l3").value;
  const l=((parseFloat(l1)||0)+(parseFloat(l2)||0)+(parseFloat(l3)||0)).toString();
  const milking=document.getElementById("prod_milking").value;
  const shipped=document.getElementById("prod_shipped").value;
  const mcFat=document.getElementById("mc_fat").value;
  const mcProt=document.getElementById("mc_protein").value;

  const mcMun=document.getElementById("mc_mun").value;
  const mpYear=document.getElementById("mp_year").value;
  const mpMonth=document.getElementById("mp_month").value;
  const mpFat=document.getElementById("mp_fat").value;
  const mpSnf=document.getElementById("mp_snf").value;
  const mpSubsidy=document.getElementById("mp_subsidy").value;
  const mpQuality=document.getElementById("mp_quality").value;
  const feed=document.getElementById("prod_feed").value;
  const feedHeads=document.getElementById("prod_feed_heads").value;
  const wo=(feed&&milking&&parseFloat(milking)>0)?(parseFloat(feed)/parseFloat(milking)).toFixed(1):"";

  const hasAny=l||milking||shipped||mcFat||mcProt||mcSnf||mcMun||mpFat||mpSnf||mpSubsidy||feed||feedHeads;
  if(!hasAny){showMsg("prodSaveMsg","少なくとも1つ入力してください",true);return;}

  const kg=l?(Math.round(parseFloat(l)*1.03*10)/10).toString():"";
  const avgNum=(kg&&shipped&&parseFloat(shipped)>0)?(parseFloat(kg)/parseFloat(shipped)):0;
  const avg=avgNum>0?avgNum.toFixed(1):"";
  const fatNum=parseFloat(mcFat)||0, protNum=parseFloat(mcProt)||0;
  const fatYieldNum=(avgNum>0&&fatNum>0)?avgNum*(fatNum/100):0;
  const fatYield=fatYieldNum>0?fatYieldNum.toFixed(2):"";
  const fatProtNum=(avgNum>0&&fatNum>0&&protNum>0)?(((avgNum*(fatNum/100))+(avgNum*((protNum-0.19)/100)))*2.2):0;
  const fatProt=fatProtNum>0?fatProtNum.toFixed(2):"";
  const fp=(mcFat&&mcProt&&parseFloat(mcProt)>0)?(parseFloat(mcFat)/parseFloat(mcProt)).toFixed(3):"";

  let unitPrice="";
  if(kg&&mcFat&&mcSnf&&mpFat&&mpSnf){
    const kgN=parseFloat(kg);
    const total=(kgN*parseFloat(mcFat)/100*parseFloat(mpFat))+(kgN*parseFloat(mcSnf)/100*parseFloat(mpSnf));
    unitPrice=(total/kgN+(parseFloat(mpSubsidy)||0)+(parseFloat(mpQuality)||0)).toFixed(2);
  }

  pushRecord("production",{
    prod_milk_l1:l1, prod_milk_l2:l2, prod_milk_l3:l3, prod_milk_l:l, prod_milk_kg:kg,
    prod_milking:milking, prod_shipped:shipped, prod_avg:avg,
    prod_fat_yield:fatYield, prod_fat_prot:fatProt,
    prod_feed:feed, prod_feed_heads:feedHeads, prod_wo:wo,
    mc_fat:mcFat, mc_protein:mcProt, mc_snf:mcSnf, mc_mun:mcMun, fp_ratio:fp,
    mp_year:mpYear, mp_month:mpMonth, mp_fat:mpFat, mp_snf:mpSnf, mp_subsidy:mpSubsidy, mp_quality:mpQuality,
    prod_unit_price:unitPrice
  });

  let msg="保存しました";
  if(avg) msg+=" / 平均"+avg+"kg/頭";
  if(fatYield) msg+=" / 脂肪生産量"+fatYield+"kg/頭";
  if(fatProt) msg+=" / Fat+Prot:"+fatProt+"lb";
  if(wo) msg+=" / 一頭当たり給餌量:"+wo+"kg/頭";
  if(fp) msg+=" / F/P:"+fp;
  if(unitPrice) msg+=" / 乳価"+unitPrice+"円/kg";
  showMsg("prodSaveMsg",msg);

  ["prod_milk_l1","prod_milk_l2","prod_milk_l3","prod_milking","prod_shipped","prod_feed","prod_feed_heads","mc_fat","mc_protein","mc_snf","mc_mun","mp_fat","mp_snf","mp_subsidy","mp_quality"].forEach(id=>{const e=document.getElementById(id);if(e)e.value="";});
  calcProd();
}

// --- メモ・写真 ---
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
          else{w=Math.round(w*maxDim/h);h=maxDim;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>reject(new Error("画像の読み込みに失敗しました"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}

async function handleMemoPhotoInput(e){
  const files=Array.from(e.target.files||[]);
  let total=countSavedPhotosForToday()+memoPhotos.length;
  let skipped=0;
  for(const f of files){
    if(total>=MEMO_PHOTO_LIMIT){skipped++;continue;}
    try{
      const dataUrl=await resizeImage(f,1024,0.6);
      memoPhotos.push(dataUrl);
      total++;
    }catch(err){/* skip failed image */}
  }
  e.target.value="";
  renderMemoPreview();
  if(skipped>0){
    alert("1日の写真枚数の上限（"+MEMO_PHOTO_LIMIT+"枚）に達しているため、"+skipped+"枚は追加されませんでした。");
  }
}

function renderMemoPreview(){

  if(!el)return;
  el.innerHTML=memoPhotos.map((src,i)=>'<div class="photo-thumb-wrap"><img class="photo-thumb" src="'+src+'"><button type="button" class="photo-remove-btn" onclick="removeMemoPhoto('+i+')">×</button></div>').join("");
  const countEl=document.getElementById("memo_photo_count");
  if(countEl){
    const savedToday=countSavedPhotosForToday();
    const total=savedToday+memoPhotos.length;
    countEl.textContent="本日の写真: "+total+" / "+MEMO_PHOTO_LIMIT+"枚";
    countEl.style.color=total>=MEMO_PHOTO_LIMIT?"var(--red)":"var(--text2)";
  }
}
window.removeMemoPhoto=function(i){memoPhotos.splice(i,1);renderMemoPreview();};

function saveMemoRecord(){
  const textEl=document.getElementById("memo_text");
  const text=textEl.value.trim();
  if(!text&&!memoPhotos.length){showMsg("memoSaveMsg","メモまたは写真を入力してください",true);return;}
  const savedToday=countSavedPhotosForToday();
  if(savedToday+memoPhotos.length>MEMO_PHOTO_LIMIT){
    showMsg("memoSaveMsg","1日の写真枚数の上限（"+MEMO_PHOTO_LIMIT+"枚）を超えています。写真を減らしてください",true);
    return;
  }
  const ok=pushRecord("memo",{text,photos:memoPhotos.slice()});
  if(!ok)return;
  showMsg("memoSaveMsg","保存しました"+(memoPhotos.length?" / 写真"+memoPhotos.length+"枚":""));
  textEl.value="";
  memoPhotos=[];
  renderMemoPreview();
}

function showMsg(id,msg,isErr){
  const el=document.getElementById(id);if(!el)return;
  el.textContent=msg;el.className="save-msg"+(isErr?" err-msg":"");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add("hidden"),3000);
}

function renderList(){

function recSummary(r){
  const page=PAGES.find(p=>p.id===r.page);
  const label=page?page.label:r.page;
  let s="";
  if(r.page==="ph") s=r.data.cow+" / pH "+Number(r.data.ph).toFixed(2)+(r.data.memo?" / "+r.data.memo:"");
  else if(r.page==="silage"){
    const p=[];
    if(r.data.harvest_year)p.push(r.data.harvest_year+"年");
    if(r.data.type)p.push(r.data.type);if(r.data.grass)p.push(r.data.grass);if(r.data.storage)p.push(r.data.storage);
    if(r.data.dm)p.push("乾物"+r.data.dm+"%");if(r.data.mold)p.push("カビ:"+r.data.mold);
    if(r.data.smell)p.push("匂い:"+r.data.smell);if(r.data.color)p.push(r.data.color);
    s=p.join(" / ");
  }
  else if(r.page==="silage_corn"){
    const p=[];const d=r.data;
    if(d.harvest_year)p.push(d.harvest_year+"年");
    if(d.storage)p.push(d.storage);if(d.dm)p.push("乾物"+d.dm+"%");
    if(d.sowing&&d.harvest)p.push("生育"+d.grow_days);
    if(d.harvest&&d.open)p.push("貯蔵"+d.store_days);
    if(d.mold)p.push("カビ:"+d.mold);if(d.smell)p.push("匂い:"+d.smell);if(d.color)p.push(d.color);
    s=p.join(" / ");
  }
  else if(r.page==="silage_stock"){
    const p=[];
    if(r.data.type)p.push(r.data.type);if(r.data.amount)p.push("在庫"+r.data.amount+"t");
    if(r.data.panel_total)p.push("パネル"+r.data.panel_used+"/"+r.data.panel_total+"枚");
    s=p.join(" / ");
  }
  else if(r.page==="milk_price") s=r.data.year+"年"+r.data.month+"月"+(r.data.mp_fat?" 脂肪:"+r.data.mp_fat+"円":"")+(r.data.mp_snf?" 無脂固:"+r.data.mp_snf+"円":"");
  else if(r.page==="feed_cost"){
    const p=[];const d=r.data;
    if(d.fc_fat_ca_price)p.push("脂肪酸Ca:"+d.fc_fat_ca_price+"円"+(d.fc_fat_ca_supplier?" ("+d.fc_fat_ca_supplier+")":""));
    if(d.fc_baking_price)p.push("重曹:"+d.fc_baking_price+"円"+(d.fc_baking_supplier?" ("+d.fc_baking_supplier+")":""));
    if(d.fc_palm_price)p.push("パルミチン酸:"+d.fc_palm_price+"円"+(d.fc_palm_supplier?" ("+d.fc_palm_supplier+")":""));
    if(d.fc_antiferment_price)p.push((d.fc_antiferment_name||"発酵防止剤")+":"+d.fc_antiferment_price+"円");
    s=p.join(" / ");
  }
  else if(r.page==="feces"){
    const p=[];const d=r.data;
    if(d.ball)p.push("糞団子:"+d.ball);if(d.mucus)p.push("粘液:"+d.mucus);
    if(d.pseudomembrane)p.push("偽膜:"+d.pseudomembrane);if(d.undigested)p.push("未消化:"+d.undigested);
    if(d.memo)p.push(d.memo);s=p.join(" / ");
  }
  else if(r.page==="pssb"){
    const d=r.data;
    s="TOP:"+d.top+" MID1:"+d.mid1+" MID2:"+d.mid2+" BOT:"+d.bottom+" 合計:"+d.total+"頭"
      +" (TOP:"+d.top_pct+"% MID1:"+d.mid1_pct+"% MID2:"+d.mid2_pct+"% BOT:"+d.bottom_pct+"%)";
  }
  else if(r.page==="production"){const d=r.data;const p=[];
    if(d.prod_milk_l)p.push("出荷合計"+d.prod_milk_l+"L→"+d.prod_milk_kg+"kg");
    if(d.prod_milking)p.push("搾乳"+d.prod_milking+"頭");
    if(d.prod_shipped)p.push("出荷"+d.prod_shipped+"頭");
    if(d.prod_avg)p.push("平均"+d.prod_avg+"kg/頭");
    if(d.prod_fat_yield)p.push("脂肪生産量"+d.prod_fat_yield+"kg/頭");
    if(d.prod_fat_prot)p.push("Fat+Prot:"+d.prod_fat_prot+"lb");
    if(d.prod_feed)p.push("給餌"+d.prod_feed+"kg");
    if(d.prod_feed_heads)p.push("給餌頭数"+d.prod_feed_heads+"頭数分");
    if(d.prod_wo)p.push("一頭当たり給餌量:"+d.prod_wo+"kg/頭");
    if(d.mc_fat)p.push("脂肪"+d.mc_fat+"%");
    if(d.mc_protein)p.push("蛋白"+d.mc_protein+"%");
    if(d.fp_ratio)p.push("F/P:"+d.fp_ratio);
    if(d.prod_unit_price)p.push("乳価"+d.prod_unit_price+"円/kg");
    s=p.join(" / ");
  }
  else if(r.page==="memo"){
    const d=r.data;const p=[];
    if(r.date)p.push(r.date);
    if(d.text)p.push(d.text);
    if(d.photos&&d.photos.length)p.push("📷"+d.photos.length+"枚");
    s=p.join(" / ");
  }
  else if(page&&page.fields) s=Object.entries(r.data).filter(([k,v])=>v).map(([k,v])=>{const f=page.fields.find(f=>f.id===k);return (f?f.label:k)+": "+v+(f&&f.unit?" "+f.unit:"");}).join(" / ");
  return {label,s};
}

// Chart helpers
function makeChart(data,yMin,yMax,color,refMin,refMax,unit){
  if(!data||!data.length)return '<div class="chart-empty">データがありません</div>';
  const W=340,H=170,PL=40,PR=10,PT=8,PB=24,cw=W-PL-PR,ch=H-PT-PB;
  const dates=data.map(d=>new Date(d.date).getTime());
  const minT=Math.min(...dates),maxT=Math.max(...dates),rangeT=maxT-minT||1;
  const tx=t=>PL+((t-minT)/rangeT)*cw;
  const ty=v=>PT+ch-((v-yMin)/(yMax-yMin||1))*ch;
  let svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible">';
  for(let i=0;i<=4;i++){const v=yMin+i*(yMax-yMin)/4;svg+='<line x1="'+PL+'" y1="'+ty(v)+'" x2="'+(W-PR)+'" y2="'+ty(v)+'" stroke="#E8EDEA" stroke-width="1"/><text x="'+(PL-4)+'" y="'+(ty(v)+4)+'" text-anchor="end" font-size="9" fill="#8AA898">'+(v%1===0?v:v.toFixed(1))+'</text>';}
  if(refMin!=null&&refMax!=null)svg+='<rect x="'+PL+'" y="'+ty(refMax)+'" width="'+cw+'" height="'+Math.abs(ty(refMin)-ty(refMax))+'" fill="'+color+'" fill-opacity="0.15"/>';
  const ud=[...new Set(data.map(d=>d.date))].sort();
  const step=Math.max(1,Math.ceil(ud.length/5));
  ud.filter((_,i)=>i%step===0||i===ud.length-1).forEach(d=>{const t=new Date(d).getTime();const p=d.split("-");svg+='<text x="'+tx(t)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="#8AA898">'+Number(p[1])+'/'+Number(p[2])+'</text>';});
  const sorted=[...data].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length>1){svg+='<polyline points="'+sorted.map(d=>tx(new Date(d.date).getTime())+","+ty(d.value)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>';}
  sorted.forEach(d=>{svg+='<circle cx="'+tx(new Date(d.date).getTime())+'" cy="'+ty(d.value)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.5"><title>'+d.date+': '+d.value+(unit||'')+'</title></circle>';});
  svg+='</svg>';return svg;
}

function makeYmChart(data,color,unit){
  if(!data||!data.length)return '<div class="chart-empty">データがありません</div>';
  const sorted=[...data].sort((a,b)=>a.ym.localeCompare(b.ym));
  const W=340,H=170,PL=46,PR=10,PT=8,PB=24,cw=W-PL-PR,ch=H-PT-PB;
  const vals=sorted.map(d=>d.value);
  const yMin=Math.floor(Math.min(...vals)*0.97/10)*10,yMax=Math.ceil(Math.max(...vals)*1.03/10)*10;
  const n=sorted.length;
  const ty=v=>PT+ch-((v-yMin)/(yMax-yMin||1))*ch;
  const tx=i=>PL+(n===1?cw/2:i/(n-1)*cw);
  let svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible">';
  for(let i=0;i<=4;i++){const v=yMin+i*(yMax-yMin)/4;svg+='<line x1="'+PL+'" y1="'+ty(v)+'" x2="'+(W-PR)+'" y2="'+ty(v)+'" stroke="#E8EDEA" stroke-width="1"/><text x="'+(PL-4)+'" y="'+(ty(v)+4)+'" text-anchor="end" font-size="9" fill="#8AA898">'+Math.round(v)+'</text>';}
  if(sorted.length>1)svg+='<polyline points="'+sorted.map((d,i)=>tx(i)+","+ty(d.value)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>';
  sorted.forEach((d,i)=>{const ym=d.ym.split("-");svg+='<circle cx="'+tx(i)+'" cy="'+ty(d.value)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="1.5"><title>'+ym[0]+'年'+Number(ym[1])+'月: '+d.value+(unit||'')+'</title></circle><text x="'+tx(i)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="#8AA898">'+ym[0].slice(2)+'/'+Number(ym[1])+'</text>';});
  svg+='</svg>';return svg;
}

  const nav=document.getElementById("chartPageNav");
  nav.innerHTML=CHART_PAGES.map(p=>'<button data-cp="'+p.id+'"'+(p.id===currentChartPage?' class="active"':'')+'>'+p.label+'</button>').join("");
